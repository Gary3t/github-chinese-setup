<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="1200" height="540" fill="#F7F8FA"/>

  <text x="600" y="54" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2430">用户脚本生效的三道闸</text>
  <text x="600" y="86" text-anchor="middle" font-size="15" fill="#6B7280">缺任何一道，页面都不会有任何变化 —— 而且不会有任何报错</text>

  <!-- Card 1 -->
  <rect x="90" y="126" width="310" height="310" rx="16" fill="#FFFFFF" stroke="#E3E6EA" stroke-width="1.5"/>
  <circle cx="140" cy="176" r="22" fill="#2563EB"/>
  <text x="140" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="176" y="184" font-size="20" font-weight="700" fill="#1F2430">扩展已启用</text>
  <line x1="118" y1="218" x2="372" y2="218" stroke="#E3E6EA" stroke-width="1.5"/>
  <text x="118" y="256" font-size="15" fill="#4B5563">在 chrome://extensions</text>
  <text x="118" y="284" font-size="15" fill="#4B5563">里能看到篡改猴处于</text>
  <text x="118" y="312" font-size="15" fill="#4B5563">「已启用」状态。</text>
  <rect x="118" y="366" width="150" height="42" rx="21" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="193" y="393" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">可半自动完成</text>

  <!-- Card 2 -->
  <rect x="445" y="126" width="310" height="310" rx="16" fill="#FFFDF7" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="495" cy="176" r="22" fill="#F59E0B"/>
  <text x="495" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="531" y="184" font-size="20" font-weight="700" fill="#1F2430">允许用户脚本</text>
  <line x1="473" y1="218" x2="727" y2="218" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="473" y="256" font-size="15" fill="#4B5563">扩展详情页里的一个</text>
  <text x="473" y="284" font-size="15" fill="#4B5563">独立开关，默认关闭。</text>
  <text x="473" y="312" font-size="15" font-weight="600" fill="#B45309">最常被忽略的一道。</text>
  <rect x="473" y="366" width="150" height="42" rx="21" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="548" y="393" text-anchor="middle" font-size="15" font-weight="600" fill="#B45309">只能人工点</text>

  <!-- Card 3 -->
  <rect x="800" y="126" width="310" height="310" rx="16" fill="#FFFFFF" stroke="#E3E6EA" stroke-width="1.5"/>
  <circle cx="850" cy="176" r="22" fill="#2563EB"/>
  <text x="850" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="886" y="184" font-size="20" font-weight="700" fill="#1F2430">脚本真的还在</text>
  <line x1="828" y1="218" x2="1082" y2="218" stroke="#E3E6EA" stroke-width="1.5"/>
  <text x="828" y="256" font-size="15" fill="#4B5563">扩展存储里确实装着</text>
  <text x="828" y="284" font-size="15" fill="#4B5563">你要用的那个脚本。</text>
  <text x="828" y="312" font-size="15" font-weight="600" fill="#B91C1C">最容易在折腾中丢掉。</text>
  <rect x="828" y="366" width="150" height="42" rx="21" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="903" y="393" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">可自动检查</text>

  <!-- Arrows -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <line x1="402" y1="281" x2="438" y2="281"/>
    <line x1="757" y1="281" x2="793" y2="281"/>
  </g>
  <polygon points="445,281 431,275 431,287" fill="#9CA3AF"/>
  <polygon points="800,281 786,275 786,287" fill="#9CA3AF"/>

  <text x="600" y="492" text-anchor="middle" font-size="15" fill="#6B7280">查的顺序：<tspan font-weight="700" fill="#1F2430">1 → 2 → 3</tspan>，不要跳着猜，更不要手改 Chrome 的 Secure Preferences。</text>
</svg>
